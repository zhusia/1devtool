         bottom URL pill cannot cover the tab bar after the toolbar collapses.
         `--app-vh` still mirrors visualViewport.height and wins only when the
         keyboard makes the visible viewport smaller than 100svh. */

        --app-vh: 100svh;
        --app-top: 0px;
      }
      /* Keep wide terminal grids and horizontally scrolling controls contained
         inside the phone shell. Clipping only on body still lets their intrinsic
         width expand the root document in mobile Safari. */
      html, body {
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }
      body { margin: 0; }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100svh;
        height: min(var(--app-vh, 100svh), 100svh);
        min-height: 0;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        transform: translateY(var(--app-top, 0px));
